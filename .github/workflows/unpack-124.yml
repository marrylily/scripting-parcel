name: unpack-124
on:
  push:
    paths:
      - "build/release124.b64"
      - ".github/workflows/unpack-124.yml"
  workflow_dispatch: {}
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode release zip and clean payload
        run: |
          set -euo pipefail
          test -f build/release124.b64
          mkdir -p releases
          base64 -d build/release124.b64 > "releases/包裹助手_远程更新_1.2.4.zip"
          python3 - << 'PY'
          import hashlib, pathlib
          p = pathlib.Path("releases/包裹助手_远程更新_1.2.4.zip")
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          print("size", p.stat().st_size, "sha256", h)
          assert p.stat().st_size == 1082033
          assert h == "b2d0def42764a4d78c1ec2dcdfb48e03d5cdbf78f7b4063a677d7ee72ad3869f"
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/包裹助手_远程更新_1.2.4.zip"
          git rm -f build/release124.b64 .github/workflows/unpack-124.yml || true
          git status
          git commit -m "Add 1.2.4 release zip and remove unpack payload"
          git push
