name: unpack-126
on:
  push:
    paths:
      - "build/release126.b64"
      - ".github/workflows/unpack-126.yml"
  workflow_dispatch: {}
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode release zip and clean payload
        run: |
          set -euo pipefail
          test -f build/release126.b64
          mkdir -p releases
          base64 -d build/release126.b64 > "releases/包裹助手_远程更新_1.2.6.zip"
          python3 - << 'PY'
          import hashlib, pathlib
          p = pathlib.Path("releases/包裹助手_远程更新_1.2.6.zip")
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          print("size", p.stat().st_size, "sha256", h)
          assert p.stat().st_size == 1087158
          assert h == "3189921236e33c50f9d7cd9799206817321b460128c834a35d62e32b019a0a32"
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/包裹助手_远程更新_1.2.6.zip"
          git rm -f build/release126.b64 .github/workflows/unpack-126.yml || true
          git status
          git commit -m "Add 1.2.6 release zip and remove unpack payload"
          git push
